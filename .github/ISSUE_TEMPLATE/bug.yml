name: Bug report
description: Report a reproducible TraceKit defect using synthetic evidence.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not include credentials, production logs, or customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
